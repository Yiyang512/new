  function decodeUtf8Base64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function sizeFrame() {
    try {
      const doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc) return;
      const body = doc.body;
      const root = doc.documentElement;
      const h = Math.max(
        body ? body.scrollHeight : 0,
        body ? body.offsetHeight : 0,
        root ? root.scrollHeight : 0,
        root ? root.offsetHeight : 0,
        root ? root.clientHeight : 0
      );
      if (h > 0) frame.style.height = Math.max(1200, h + 30) + 'px';
    } catch (e) {
      console.warn('Hemiya auto-size unavailable:', e);
    }
  }

  frame.addEventListener('load', function () {
    sizeFrame();
    try {
      const doc = frame.contentDocument || frame.contentWindow.document;
      if (doc && window.ResizeObserver) {
        const ro = new ResizeObserver(sizeFrame);
        ro.observe(doc.documentElement);
        if (doc.body) ro.observe(doc.body);
      }
    } catch (e) {}
    setTimeout(sizeFrame, 500);
    setTimeout(sizeFrame, 1500);
    setTimeout(sizeFrame, 3000);
  });

  window.addEventListener('resize', sizeFrame);
