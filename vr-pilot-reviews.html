<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Required for YouTube embeds (avoids Error 153) -->
  <meta name="referrer" content="origin" />
  <title>VR Pilot Reviews — Simple French with HEMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sf-stories-text: #ffffff;
      --sf-stories-muted: rgba(255, 255, 255, 0.55);
      --sf-stories-accent: #3d9eff;
      --sf-stories-accent-soft: rgba(61, 158, 255, 0.16);
      --sf-stories-accent-glow: rgba(61, 158, 255, 0.4);
      --sf-stories-border: rgba(255, 255, 255, 0.22);
      --sf-stories-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --sf-stories-font: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --sf-stories-pad-x: 16px;
      --sf-stories-max: 860px;
      --sf-stories-gap: 12px;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--sf-stories-text);
      font-family: var(--sf-stories-font);
      -webkit-font-smoothing: antialiased;
    }

    .sf-stories {
      position: relative;
      padding: 24px 0 calc(20px + env(safe-area-inset-bottom, 0px));
      background: transparent;
    }

    .sf-stories__head {
      width: min(var(--sf-stories-max), calc(100% - (var(--sf-stories-pad-x) * 2)));
      margin: 0 auto 12px;
    }

    .sf-stories__eyebrow {
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sf-stories-accent);
    }

    .sf-stories__title {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .sf-stories__filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: min(var(--sf-stories-max), calc(100% - (var(--sf-stories-pad-x) * 2)));
      margin: 0 auto 14px;
    }

    .sf-stories__filter {
      appearance: none;
      border: 1px solid var(--sf-stories-border);
      background: transparent;
      color: var(--sf-stories-text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 12px;
      min-height: 36px;
      cursor: pointer;
      transition:
        background 0.3s var(--sf-stories-ease),
        border-color 0.3s var(--sf-stories-ease),
        color 0.3s var(--sf-stories-ease),
        box-shadow 0.3s var(--sf-stories-ease);
    }

    .sf-stories__filter:hover {
      border-color: var(--sf-stories-accent);
      color: var(--sf-stories-accent);
    }

    .sf-stories__filter.is-active {
      background: var(--sf-stories-accent);
      border-color: var(--sf-stories-accent);
      color: #041018;
      box-shadow: 0 0 18px var(--sf-stories-accent-glow);
    }

    .sf-stories__filter:focus-visible {
      outline: 2px solid var(--sf-stories-accent);
      outline-offset: 2px;
    }

    .sf-stories__grid {
      width: min(var(--sf-stories-max), calc(100% - (var(--sf-stories-pad-x) * 2)));
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--sf-stories-gap);
    }

    .sf-stories__card {
      position: relative;
      aspect-ratio: 9 / 16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0a0a0a;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.3s var(--sf-stories-ease),
        border-color 0.3s var(--sf-stories-ease),
        box-shadow 0.3s var(--sf-stories-ease);
    }

    @media (hover: hover) and (pointer: fine) {
      .sf-stories__card:hover {
        transform: translateY(-4px);
        border-color: rgba(61, 158, 255, 0.55);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5), 0 0 24px var(--sf-stories-accent-soft);
      }

      .sf-stories__card:hover .sf-stories__thumb {
        transform: scale(1.04);
        filter: none;
      }

      .sf-stories__card:hover .sf-stories__play {
        border-color: var(--sf-stories-accent);
        background: rgba(61, 158, 255, 0.22);
        box-shadow: 0 0 18px var(--sf-stories-accent-glow);
        transform: scale(1.06);
      }
    }

    .sf-stories__thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      /* Tone down busy Shorts caption overlays baked into the frame */
      filter: saturate(0.92) contrast(1.04) brightness(0.92);
      transition: transform 0.45s var(--sf-stories-ease), filter 0.35s var(--sf-stories-ease);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .sf-stories__overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, transparent 28%, transparent 48%, rgba(0, 0, 0, 0.88) 100%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(0, 0, 0, 0.55), transparent 70%);
    }

    .sf-stories__overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

    .sf-stories__play {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      margin: -24px 0 0 -24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
      z-index: 2;
      transition:
        transform 0.3s var(--sf-stories-ease),
        border-color 0.3s var(--sf-stories-ease),
        background 0.3s var(--sf-stories-ease),
        box-shadow 0.3s var(--sf-stories-ease);
    }

    .sf-stories__play::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 3px;
      border-style: solid;
      border-width: 8px 0 8px 13px;
      border-color: transparent transparent transparent #fff;
    }

    .sf-stories__meta {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 28px 12px 12px;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.72) 40%, rgba(0, 0, 0, 0.92));
    }

    .sf-stories__category {
      display: inline-block;
      margin-bottom: 6px;
      padding: 3px 7px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #041018;
      background: var(--sf-stories-accent);
    }

    .sf-stories__name {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sf-stories__card.is-playing .sf-stories__play,
    .sf-stories__card.is-playing .sf-stories__overlay,
    .sf-stories__card.is-playing .sf-stories__meta,
    .sf-stories__card.is-playing .sf-stories__thumb {
      opacity: 0;
      pointer-events: none;
    }

    .sf-stories__iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #000;
    }

    .sf-stories__card.is-playing .sf-stories__iframe { display: block; }

    .sf-stories__card:focus-visible {
      outline: 2px solid var(--sf-stories-accent);
      outline-offset: 3px;
    }

    .sf-stories__status {
      width: min(var(--sf-stories-max), calc(100% - (var(--sf-stories-pad-x) * 2)));
      margin: 12px auto 0;
      color: var(--sf-stories-muted);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .sf-stories__status strong {
      color: var(--sf-stories-text);
      font-weight: 600;
    }

    .sf-stories__empty {
      display: none;
      margin: 24px auto;
      width: min(var(--sf-stories-max), calc(100% - (var(--sf-stories-pad-x) * 2)));
      text-align: center;
      color: var(--sf-stories-muted);
      font-size: 14px;
    }

    .sf-stories__empty.is-visible { display: block; }

    @media (max-width: 768px) {
      :root { --sf-stories-pad-x: 14px; --sf-stories-gap: 10px; }

      .sf-stories { padding: 18px 0 16px; }

      .sf-stories__filters {
        flex-wrap: nowrap;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        width: 100%;
        max-width: none;
        padding: 0 var(--sf-stories-pad-x) 4px;
        margin: 0 0 12px;
        mask-image: linear-gradient(90deg, #000 85%, transparent);
        -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent);
      }

      .sf-stories__filters::-webkit-scrollbar { display: none; }

      .sf-stories__filter {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 8px 14px;
        font-size: 10px;
      }

      .sf-stories__grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .sf-stories__play { width: 36px; height: 36px; margin: -18px 0 0 -18px; }
      .sf-stories__name { font-size: 12px; }
    }

    @media (max-width: 480px) {
      :root { --sf-stories-pad-x: 12px; --sf-stories-gap: 8px; }

      .sf-stories { padding: 16px 0 14px; }
      .sf-stories__title { font-size: 18px; }
      .sf-stories__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sf-stories__category { font-size: 8px; }
      .sf-stories__name { font-size: 11px; }
      .sf-stories__meta { left: 8px; right: 8px; bottom: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <!-- VR Shorts grid — 3 per row. Host on GitHub Pages for Payhip iframe. -->
  <section class="sf-stories" aria-labelledby="sf-stories-title">
    <div class="sf-stories__head">
      <p class="sf-stories__eyebrow">VR Pilot Sessions</p>
      <h2 class="sf-stories__title" id="sf-stories-title">Workshops &amp; pilot reviews</h2>
    </div>

    <div class="sf-stories__filters" role="tablist" aria-label="Filter by category">
      <button type="button" class="sf-stories__filter is-active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button type="button" class="sf-stories__filter" data-filter="seesa" role="tab" aria-selected="false">SEESA</button>
      <button type="button" class="sf-stories__filter" data-filter="garneau" role="tab" aria-selected="false">Garneau School</button>
      <button type="button" class="sf-stories__filter" data-filter="edmonton-unlimited" role="tab" aria-selected="false">Edmonton Unlimited</button>
    </div>

    <div class="sf-stories__grid" id="sf-stories-grid" role="list"></div>
    <p class="sf-stories__empty" id="sf-stories-empty">No videos in this category.</p>
    <p class="sf-stories__status" id="sf-stories-status" aria-live="polite"><strong>6</strong> videos</p>
  </section>

  <script>
    (function () {
      var videos = [
        { id: "OfY9T82TW64", name: "SEESA Senior", category: "seesa", label: "SEESA" },
        { id: "HucC33Zl39A", name: "SEESA Coordinator", category: "seesa", label: "SEESA" },
        { id: "CSWJo5JorfI", name: "Garneau Participants", category: "garneau", label: "Garneau" },
        { id: "deS9Um4yWyQ", name: "Garneau Participant", category: "garneau", label: "Garneau" },
        { id: "OVW9BMsgSHs", name: "Garneau Event Leader", category: "garneau", label: "Garneau" },
        { id: "jb-ULO88hZ4", name: "Edmonton Unlimited", category: "edmonton-unlimited", label: "Edmonton Unlimited" }
      ];

      var grid = document.getElementById("sf-stories-grid");
      var statusEl = document.getElementById("sf-stories-status");
      var emptyEl = document.getElementById("sf-stories-empty");
      var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".sf-stories__filter"));
      var visible = videos.slice();
      var playingId = null;

      function stopPlaying() {
        var playing = grid.querySelector(".sf-stories__card.is-playing");
        if (!playing) return;
        playing.classList.remove("is-playing");
        var iframe = playing.querySelector(".sf-stories__iframe");
        if (iframe) iframe.remove();
        playingId = null;
      }

      function playCard(card) {
        if (!card) return;
        stopPlaying();

        var id = card.getAttribute("data-id");
        var name = card.getAttribute("data-name") || "review";
        var origin = window.location.origin || "";
        var canEmbed =
          /^https?:$/i.test(window.location.protocol) &&
          origin &&
          origin !== "null";

        if (!canEmbed) {
          window.open("https://www.youtube.com/shorts/" + id, "_blank", "noopener");
          return;
        }

        var params =
          "autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=" +
          encodeURIComponent(origin);

        var iframe = document.createElement("iframe");
        iframe.className = "sf-stories__iframe";
        iframe.title = "YouTube Short: " + name;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.setAttribute("allowfullscreen", "true");
        iframe.setAttribute("frameborder", "0");
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");

        card.appendChild(iframe);
        card.classList.add("is-playing");
        playingId = id;
        iframe.src = "https://www.youtube.com/embed/" + id + "?" + params;
      }

      function renderCards() {
        stopPlaying();
        grid.innerHTML = "";

        visible.forEach(function (video) {
          var card = document.createElement("article");
          card.className = "sf-stories__card";
          card.setAttribute("role", "listitem");
          card.setAttribute("tabindex", "0");
          card.setAttribute("data-id", video.id);
          card.setAttribute("data-name", video.name);
          card.setAttribute("aria-label", video.label + " review: " + video.name);

          // Shorts ship true vertical maxres (720x1280). hqdefault is only ~360px and looks blurry.
          card.innerHTML =
            '<img class="sf-stories__thumb" src="https://i.ytimg.com/vi/' + video.id + '/maxresdefault.jpg" alt="" loading="lazy" width="720" height="1280" decoding="async" data-fallbacks="hq720,sddefault,hqdefault" />' +
            '<div class="sf-stories__overlay" aria-hidden="true"></div>' +
            '<div class="sf-stories__play" aria-hidden="true"></div>' +
            '<div class="sf-stories__meta">' +
              '<span class="sf-stories__category">' + video.label + "</span>" +
              '<p class="sf-stories__name">' + video.name + "</p>" +
            "</div>";

          var thumb = card.querySelector(".sf-stories__thumb");
          thumb.addEventListener("error", function onThumbError() {
            var order = (thumb.getAttribute("data-fallbacks") || "").split(",");
            if (!order.length || !order[0]) {
              thumb.removeEventListener("error", onThumbError);
              return;
            }
            var next = order.shift().trim();
            thumb.setAttribute("data-fallbacks", order.join(","));
            thumb.src = "https://i.ytimg.com/vi/" + video.id + "/" + next + ".jpg";
          });

          card.addEventListener("click", function () {
            if (playingId === video.id) return;
            playCard(card);
          });

          card.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              card.click();
            }
          });

          grid.appendChild(card);
        });

        emptyEl.classList.toggle("is-visible", visible.length === 0);
        statusEl.innerHTML =
          "<strong>" + visible.length + "</strong> video" + (visible.length === 1 ? "" : "s");
      }

      function applyFilter(filter) {
        visible = videos.filter(function (v) {
          return filter === "all" || v.category === filter;
        });

        filterBtns.forEach(function (btn) {
          var on = btn.getAttribute("data-filter") === filter;
          btn.classList.toggle("is-active", on);
          btn.setAttribute("aria-selected", on ? "true" : "false");
        });

        renderCards();
      }

      filterBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyFilter(btn.getAttribute("data-filter"));
        });
      });

      renderCards();
    })();
  </script>
</body>
</html>
