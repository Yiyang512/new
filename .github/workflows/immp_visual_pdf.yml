name: IMMP Visual PDF
on:
  push:
    branches: [immp-director-pdf-build-20261011]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install reportlab pillow requests
      - run: python tools/build_immp_director_pdf_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: IMMP_Director_Visual_Brief
          path: IMMP_Director_Visual_Brief.pdf
          if-no-files-found: error
